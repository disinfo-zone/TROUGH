version: '3.8'

services:
  app:
    image: ghcr.io/disinfo-zone/trough:${TAG:-main}
    ports:
      - "8080:8080"
    environment:
      # Required environment variables for the application
      # Set these in your environment or in a .env file 
      - DATABASE_URL=postgres://trough:trough@db:5432/trough?sslmode=disable
      - JWT_SECRET=${JWT_SECRET} # IMPORTANT: Set a strong secret (>=32 random bytes)
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      # Optional cookie flags
      - FORCE_SECURE_COOKIES=${FORCE_SECURE_COOKIES:-false}
      - ALLOW_INSECURE_COOKIES=${ALLOW_INSECURE_COOKIES:-false}
      # Storage configuration (local by default)
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-local}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - R2_ENDPOINT=${R2_ENDPOINT:-}
      - R2_BUCKET=${R2_BUCKET:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - STORAGE_PUBLIC_BASE_URL=${STORAGE_PUBLIC_BASE_URL:-}
      - UPLOADS_DIR=${UPLOADS_DIR:-uploads}
      # Go runtime tuning. On a multi-core host Go otherwise sets GOMAXPROCS to the
      # host core count, which inflates scheduler/GC/sysmon overhead and is the main
      # cause of idle CPU burn. automaxprocs will derive GOMAXPROCS from the cpus
      # limit below; GOMAXPROCS here is a belt-and-suspenders default if no quota is
      # detected. GOMEMLIMIT gives the GC a soft ceiling; GOGC trades a little RAM
      # for fewer GC cycles at idle.
      - GOMAXPROCS=${GOMAXPROCS:-2}
      - GOMEMLIMIT=${GOMEMLIMIT:-256MiB}
      - GOGC=${GOGC:-150}
    # CPU/memory bounds. automaxprocs reads the CPU quota to size GOMAXPROCS.
    # Raise these if you run a busy instance.
    cpus: ${APP_CPUS:-2}
    mem_limit: ${APP_MEM_LIMIT:-384m}
    volumes:
      - ./uploads:/app/uploads
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=trough
      - POSTGRES_PASSWORD=trough
      - POSTGRES_DB=trough
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trough"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  postgres_data:
